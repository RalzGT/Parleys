name: Actualizar partidos y publicar

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 5:00 a. m. de Honduras
  workflow_dispatch:        # botón para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar data.js
        run: python3 update.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Mantener activo Supabase
        run: |
          python3 - <<'PY'
          import re, urllib.request
          try:
              c = open("config.js", encoding="utf-8").read()
              url = re.search(r'SUPABASE_URL\s*=\s*"([^"]+)"', c).group(1)
              key = re.search(r'SUPABASE_KEY\s*=\s*"([^"]+)"', c).group(1)
              req = urllib.request.Request(url + "/rest/v1/jugadores?select=nombre&limit=1", headers={"apikey": key})
              print("Supabase respondió:", urllib.request.urlopen(req, timeout=30).status)
          except Exception as e:
              print("Aviso: no pude despertar Supabase:", e)
          PY

      - name: Preparar sitio
        run: |
          mkdir site
          cp *.html *.js site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
